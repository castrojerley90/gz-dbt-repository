version: 2

sources:
   - name: raw
     database: jc-data-analytics
     schema: gz_raw_data
     loader: bigquery
     description: 'Tables from gz_raw_data dataset'
     tables:
       - name: sales
         identifier: raw_gz_sales
         description: sales of Greenweez / we have on row per product_id found in each orders_id
         loaded_at_field: "TIMESTAMP(date_date)"
         freshness: 
            warn_after: {count: 90, period: day}
         columns: 
          - name: date_date
            description: date of purchase 
          - name: orders_id
            description: unique identifier for each order
          - name: products_id
            description: unique identifier for each product
          - name: revenue
            description: total sales 
          - name: quantity
            description: number of products sold
         tests:
          - unique:
              column_name: "( orders_id || '-' || pdt_id )"
       - name: product
         identifier: raw_gz_product
         description: overview of products inventories and price 
         columns: 
          - name: products_id
            description: unique identifier for each product
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: price for each product
       - name: ship
         identifier: raw_gz_ship
         description: ship table with one shipping fee column 
         columns: 
          - name: orders_id
            description: unique identifier for each order
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: price for shipping 
          - name: logcost
            description: logistics cost
          - name: ship_cost
            description: shipping cost
